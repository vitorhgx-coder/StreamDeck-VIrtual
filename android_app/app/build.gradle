plugins {
    id 'com.android.application'
}

android {
    namespace 'com.streamdeck.painel'
    compileSdk 34

    defaultConfig {
        applicationId "com.streamdeck.painel"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // assinado com a chave de depuracao: instala direto no celular (uso pessoal)
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
