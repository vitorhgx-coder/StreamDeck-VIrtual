<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deck">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="/icons.js"></script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Stream Deck</title>
<style>
  :root {
    --bg: #0a0c10;
    --panel: #151921;
    --panel-2: #1b2029;
    --line: #272d39;
    --text: #eaeef5;
    --muted: #8590a3;
    --accent: #8f95b2;
    --red: #ff4757;
    --amber: #ffb347;
    --radius: 18px;
  }
  [data-accent="obs"]     { --accent: #9b8cff; }
  [data-accent="steam"]   { --accent: #4db0ff; }
  [data-accent="epic"]    { --accent: #e6e9ef; }
  [data-accent="windows"] { --accent: #35d6a0; }
  [data-accent="system"]  { --accent: #ffb347; }
  [data-accent="custom"]  { --accent: #ff6fa5; }
  [data-accent="browser"] { --accent: #ff8a4d; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation;
    min-height: 100vh; min-height: 100dvh;
    background:
      radial-gradient(900px 420px at 50% -120px, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%),
      var(--bg);
  }
  button { font: inherit; color: inherit; }

  /* ---------- cabecalho ---------- */
  #top {
    position: sticky; top: 0; z-index: 10;
    padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
    background: rgba(10, 12, 16, .82);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(255,255,255,.05);
  }
  .bar { display: flex; align-items: center; gap: 10px; min-height: 40px; }
  #back {
    width: 40px; height: 40px; flex: none; border-radius: 12px; font-size: 24px; line-height: 1;
    background: var(--panel-2); border: 1px solid var(--line);
  }
  #back[hidden], #fs[hidden] { display: none; }
  #fs {
    width: 40px; height: 40px; flex: none; border-radius: 12px; display: grid; place-items: center;
    background: var(--panel-2); border: 1px solid var(--line);
  }
  #title { font-size: 19px; font-weight: 700; letter-spacing: .01em; flex: 1; min-width: 0;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #title::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%;
                   background: var(--accent); margin-right: 9px; box-shadow: 0 0 12px var(--accent); }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 9px; }
  #chips:empty { display: none; }
  .chip {
    font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    padding: 5px 9px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel-2);
    color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chip.live { color: #fff; background: var(--red); border-color: var(--red); animation: pulse 1.6s infinite; }
  .chip.rec  { color: var(--red); border-color: var(--red); }
  .chip.scene { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); min-width: 0; max-width: 100%; }
  #searchWrap { padding-top: 10px; }
  #search {
    width: 100%; padding: 11px 14px; border-radius: 12px; font-size: 16px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    -webkit-user-select: text; user-select: text; outline: none;
  }
  #search:focus { border-color: var(--accent); }

  /* ---------- avisos ---------- */
  .banner {
    margin: 12px 14px 0; padding: 11px 14px; border-radius: 12px; font-size: 13.5px;
    background: rgba(255, 179, 71, .1); border: 1px solid rgba(255, 179, 71, .35); color: #ffd79a;
  }
  .banner.off { background: rgba(255, 71, 87, .1); border-color: rgba(255, 71, 87, .4); color: #ff9aa4; }
  .banner[hidden] { display: none; }

  /* ---------- grade ---------- */
  main { padding: 6px 14px calc(env(safe-area-inset-bottom) + 40px); }
  .sec {
    margin: 22px 4px 9px; font-size: 11px; font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase; color: var(--muted);
  }
  .sec:first-child { margin-top: 14px; }
  .grid { display: grid; gap: 10px; grid-template-columns: repeat(3, 1fr); }
  .grid.games { grid-template-columns: repeat(2, 1fr); }
  @media (min-width: 520px) { .grid { grid-template-columns: repeat(4, 1fr); } .grid.games { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 820px) { .grid { grid-template-columns: repeat(6, 1fr); } .grid.games { grid-template-columns: repeat(4, 1fr); } }

  .key {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 7px; aspect-ratio: 1; padding: 10px 8px; min-width: 0;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    box-shadow: 0 1px 0 rgba(255,255,255,.05) inset, 0 8px 16px -8px rgba(0,0,0,.6);
    transition: transform .08s ease, border-color .15s, box-shadow .15s, opacity .15s;
    cursor: pointer;
  }
  .key:active { transform: scale(.94); }
  .key .ico { font-size: clamp(28px, 9vw, 38px); line-height: 1; }
  .key .lbl {
    font-size: 12.5px; font-weight: 600; text-align: center; line-height: 1.2; max-width: 100%;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word;
  }
  .key .sub { font-size: 10.5px; color: var(--muted); margin-top: -3px; max-width: 100%;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .key.on {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent) inset, 0 0 24px -8px var(--accent);
  }
  .key.on::after {
    content: ""; position: absolute; top: 9px; right: 9px; width: 8px; height: 8px;
    border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent);
  }
  .key.t-live.on { --accent: var(--red); animation: pulse 1.6s infinite; }
  .key.t-danger .lbl { color: #ff8f99; }
  .key.busy { opacity: .55; pointer-events: none; }

  /* pastas */
  .key.folder {
    background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 20%, var(--panel-2)), var(--panel) 75%);
    border-color: color-mix(in srgb, var(--accent) 35%, var(--line));
  }
  .key.folder .ico { font-size: clamp(32px, 10vw, 44px); }
  .key.folder .lbl { font-size: 13.5px; font-weight: 700; }
  .key.folder::before {
    content: "›"; position: absolute; top: 6px; right: 12px; font-size: 22px; font-weight: 700;
    color: color-mix(in srgb, var(--accent) 80%, white); line-height: 1.2;
  }
  .key.wide {
    grid-column: 1 / -1; aspect-ratio: auto; flex-direction: row; justify-content: flex-start;
    gap: 12px; padding: 15px 18px;
  }
  .key.wide .ico { font-size: 24px; }
  .key.wide .lbl { font-size: 14.5px; text-align: left; flex: 1; }

  /* jogos */
  .key.game {
    aspect-ratio: 460 / 215; padding: 0; overflow: hidden; justify-content: flex-end; align-items: stretch;
    border-radius: 14px;
  }
  .key.game .cover { position: absolute; inset: 0; }
  .key.game .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .key.game .initial {
    position: absolute; inset: 0; display: grid; place-items: center; font-size: 44px; font-weight: 800;
    color: hsl(var(--h) 70% 82% / .9);
    background: linear-gradient(135deg, hsl(var(--h) 38% 24%), hsl(calc(var(--h) + 40) 40% 14%));
  }
  .key.game .lbl {
    position: relative; text-align: left; padding: 26px 10px 8px; font-size: 12.5px; font-weight: 700;
    background: linear-gradient(transparent, rgba(0,0,0,.88)); text-shadow: 0 1px 2px rgba(0,0,0,.8);
    -webkit-line-clamp: 1;
  }
  .key.game .ico { display: none; }
  .key.game.hide, .hide { display: none !important; }

  .empty { text-align: center; color: var(--muted); padding: 60px 20px; }

  /* ---------- toast ---------- */
  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); z-index: 30;
    transform: translate(-50%, 30px); opacity: 0; pointer-events: none; max-width: calc(100% - 32px);
    padding: 12px 18px; border-radius: 14px; font-size: 14px; font-weight: 600; text-align: center;
    background: #222834; border: 1px solid var(--line); box-shadow: 0 12px 30px rgba(0,0,0,.5);
    transition: opacity .2s, transform .2s;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.err { background: #35161b; border-color: var(--red); color: #ffc2c8; }

  /* ---------- login ---------- */
  #login {
    position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px;
    background: rgba(10, 12, 16, .96);
  }
  #login[hidden] { display: none; }
  .card {
    width: 100%; max-width: 340px; padding: 26px 22px; border-radius: 22px; text-align: center;
    background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line);
  }
  .card h1 { margin: 0 0 4px; font-size: 22px; }
  .card p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  #pin {
    width: 100%; padding: 14px; border-radius: 14px; font-size: 26px; letter-spacing: .4em; text-align: center;
    background: var(--bg); color: var(--text); border: 1px solid var(--line); outline: none;
    -webkit-user-select: text; user-select: text;
  }
  #pin:focus { border-color: var(--accent); }
  #loginBtn {
    width: 100%; margin-top: 12px; padding: 14px; border-radius: 14px; border: 0; font-weight: 700; font-size: 16px;
    background: var(--accent); color: #0a0c10;
  }
  #loginErr { min-height: 20px; margin-top: 10px; color: #ff9aa4; font-size: 13.5px; }

  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,71,87,.55); } 50% { box-shadow: 0 0 0 7px rgba(255,71,87,0); } }

  /* ---------- v3: icones reais, abas, editor ---------- */
  :root { --tabh: 64px; }
  [data-accent="jogos"] { --accent: #6fe08a; }
  [data-accent="modes"] { --accent: #c58bff; }
  .opt.danger b, .opt.danger .ic { color: #ff9aa4; }
  .key.window[data-pin] { border-style: dashed; }
  .ic { display: inline-flex; align-items: center; justify-content: center; width: 1em; height: 1em; flex: none; }
  .ic svg, .ic img { width: 100%; height: 100%; display: block; }
  .ic img { object-fit: contain; border-radius: 22%; }
  .ic.ui svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .key .ico { display: inline-flex; font-size: clamp(30px, 9.5vw, 40px); color: color-mix(in srgb, var(--accent) 70%, #fff); }
  .key.folder .ico { font-size: clamp(32px, 10vw, 42px); }
  .key.wide .ico { font-size: 26px; }
  .key .ico .ic { width: 1em; height: 1em; }
  .key.game .cover .gico { position: absolute; left: 50%; top: 40%; width: 52px; height: 52px; transform: translate(-50%, -50%); }
  .key.game .cover .gico img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0,0,0,.5)); }
  .key.window { aspect-ratio: auto; min-height: 92px; }
  .key.window .lbl { font-size: 12px; }

  main { padding-bottom: calc(env(safe-area-inset-bottom) + var(--tabh) + 36px); }
  #toast { bottom: calc(env(safe-area-inset-bottom) + var(--tabh) + 16px); }

  .hbtn { width: 40px; height: 40px; flex: none; border-radius: 12px; display: grid; place-items: center; font-size: 20px;
          background: var(--panel-2); border: 1px solid var(--line); }
  .hbtn[hidden] { display: none; }
  .hbtn.on { background: var(--accent); color: #0a0c10; border-color: var(--accent); }
  #add { background: color-mix(in srgb, var(--accent) 24%, var(--panel-2)); border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }

  #tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 12; display: flex; overflow-x: auto; scrollbar-width: none;
          padding: 6px 6px calc(env(safe-area-inset-bottom) + 6px); gap: 4px;
          background: rgba(14, 17, 23, .92); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
          border-top: 1px solid rgba(255,255,255,.07); }
  #tabs::-webkit-scrollbar { display: none; }
  #tabs[hidden] { display: none; }
  .tab { flex: 1 0 64px; min-width: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
         height: 52px; border: 0; border-radius: 14px; background: none; color: var(--muted); font-size: 10.5px; font-weight: 700; letter-spacing: .02em; }
  .tab .ic { font-size: 22px; }
  .tab span.t { max-width: 72px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab.on { color: var(--text); background: color-mix(in srgb, var(--accent) 22%, transparent); }
  .tab.on .ic.ui { color: var(--accent); }

  /* modo editar */
  body.editing .key[data-cid], body.editing .key[data-mid], body.editing .key[data-okey] { outline: 2px dashed var(--accent); outline-offset: -3px; }
  body.editing .key[data-cid]::after, body.editing .key[data-mid]::after, body.editing .key[data-okey]::after { content: "✎"; position: absolute; top: 6px; left: 8px; right: auto; width: auto; height: auto; background: none;
                                      box-shadow: none; font-size: 14px; color: var(--accent); }
  body.editing .key[data-kind="window"] { opacity: .4; }
  .key.off { opacity: .35; filter: grayscale(1); }
  .key.off .lbl::after { content: " (oculto)"; font-weight: 500; }
  .grp { margin: 16px 2px 8px; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .emptybox { margin: 40px 20px; text-align: center; color: var(--muted); }
  .emptybox .btn { margin-top: 14px; flex: none; padding: 14px 22px; }
  .steps { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .step { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); }
  .step .ic { font-size: 22px; color: var(--accent); }
  .step .meta { flex: 1; min-width: 0; }
  .step .meta b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step .meta small { color: var(--muted); font-size: 11.5px; }
  .step button { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--bg); border: 1px solid var(--line); font-size: 16px; }
  .pill.ghost { background: none; border-style: dashed; }
  #editbar { margin: 12px 14px 0; padding: 10px 14px; border-radius: 12px; font-size: 13px; color: var(--accent);
             background: color-mix(in srgb, var(--accent) 12%, transparent); border: 1px dashed color-mix(in srgb, var(--accent) 50%, var(--line)); }
  #editbar[hidden] { display: none; }

  /* painel inferior (adicionar/editar) */
  #sheetBg { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; }
  #sheetBg[hidden] { display: none; }
  #sheet { width: 100%; max-width: 640px; max-height: 92dvh; overflow-y: auto; -webkit-overflow-scrolling: touch;
           background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 24px 24px 0 0;
           padding: 8px 16px calc(env(safe-area-inset-bottom) + 18px); -webkit-user-select: text; user-select: text; }
  #sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 12px; }
  #sheet h2 { margin: 0 0 4px; font-size: 19px; }
  #sheet .hint { color: var(--muted); font-size: 13.5px; margin: 0 0 14px; }
  .types { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .type { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 13px; border-radius: 16px;
          background: var(--panel-2); border: 1px solid var(--line); }
  .type .ic { font-size: 26px; color: var(--accent); margin-bottom: 4px; }
  .type b { font-size: 14.5px; }
  .type small { color: var(--muted); font-size: 12px; line-height: 1.3; }
  .fld { display: block; margin: 14px 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .inp { width: 100%; padding: 12px 14px; border-radius: 12px; font-size: 16px; background: var(--bg); color: var(--text);
         border: 1px solid var(--line); outline: none; -webkit-user-select: text; user-select: text; }
  .inp:focus { border-color: var(--accent); }
  select.inp { appearance: none; -webkit-appearance: none; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { padding: 9px 13px; border-radius: 99px; font-size: 13.5px; font-weight: 600; background: var(--panel-2); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 7px; }
  .pill .ic { font-size: 16px; }
  .pill.sel { background: color-mix(in srgb, var(--accent) 24%, var(--panel-2)); border-color: var(--accent); }
  .list { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; margin-top: 8px; }
  .opt { display: flex; align-items: center; gap: 12px; text-align: left; padding: 9px 12px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); }
  .opt .ic { font-size: 28px; }
  .opt .meta { min-width: 0; flex: 1; }
  .opt .meta b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .opt .meta small { color: var(--muted); font-size: 11.5px; }
  .opt.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--panel-2)); }
  .logos { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; max-height: 190px; overflow-y: auto; margin-top: 8px; }
  .logo { aspect-ratio: 1; display: grid; place-items: center; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); font-size: 24px; }
  .logo.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 22%, var(--panel-2)); }
  .logo.auto { font-size: 11px; font-weight: 700; color: var(--muted); }
  .acts { display: flex; gap: 10px; margin-top: 20px; }
  .btn { flex: 1; padding: 14px; border-radius: 14px; font-weight: 700; font-size: 15.5px; border: 1px solid var(--line); background: var(--panel-2); }
  .btn.pri { background: var(--accent); color: #0a0c10; border-color: var(--accent); }
  .btn.dng { color: #ff9aa4; border-color: rgba(255,71,87,.5); flex: 0 0 auto; padding: 14px 16px; }
  .btn.mini { flex: 0 0 auto; padding: 14px 16px; }
  .msg { color: #ff9aa4; font-size: 13.5px; min-height: 18px; margin-top: 10px; }
  .chk { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 14.5px; }
  .chk input { width: 22px; height: 22px; accent-color: var(--accent); }
  .preview { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .preview code { color: var(--text); background: var(--bg); padding: 3px 8px; border-radius: 8px; }

  /* ---------- celular deitado (paisagem): trilho de abas na lateral, tudo mais compacto ---------- */
  @media (orientation: landscape) and (max-height: 560px) {
    :root { --railw: 76px; }
    body { font-size: 14px; }
    #top { padding: calc(env(safe-area-inset-top) + 4px) calc(env(safe-area-inset-right) + 10px) 4px calc(var(--railw) + env(safe-area-inset-left) + 10px); }
    .bar { min-height: 36px; gap: 8px; }
    #back, #fs, .hbtn { width: 36px; height: 36px; border-radius: 10px; font-size: 18px; }
    #title { font-size: 16px; }
    #chips { padding-top: 0; flex-wrap: nowrap; overflow: hidden; max-width: 42%; }
    .bar { flex-wrap: nowrap; }
    #top { display: flex; align-items: center; gap: 10px; }
    #top .bar { flex: 1; min-width: 0; }
    #chips:empty { display: none; }
    .chip { font-size: 10px; padding: 3px 8px; }
    #searchWrap { padding-top: 0; width: 220px; flex: none; }
    #search { padding: 7px 12px; font-size: 14px; border-radius: 10px; }
    .banner, #editbar { margin: 8px calc(env(safe-area-inset-right) + 12px) 0 calc(var(--railw) + env(safe-area-inset-left) + 12px); padding: 7px 12px; font-size: 12.5px; }
    main { padding: 2px calc(env(safe-area-inset-right) + 12px) 24px calc(var(--railw) + env(safe-area-inset-left) + 12px); }
    .sec { margin: 12px 4px 6px; font-size: 10.5px; }
    .sec:first-child { margin-top: 8px; }
    .grid, .grid.games { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
    .grid.games { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .key { aspect-ratio: auto; min-height: 80px; height: 80px; padding: 6px; gap: 4px; border-radius: 14px; }
    .key .ico, .key.folder .ico { font-size: 28px; }
    .key .lbl, .key.folder .lbl { font-size: 11.5px; line-height: 1.15; }
    .key .sub { display: none; }
    .key.folder::before { top: 2px; right: 9px; font-size: 18px; }
    .key.on::after { top: 7px; right: 7px; }
    .key.game { aspect-ratio: 460 / 215; height: auto; min-height: 0; }
    .key.game .lbl { padding: 16px 8px 5px; font-size: 11.5px; }
    .key.game .initial { font-size: 32px; }
    .key.wide { height: auto; min-height: 52px; padding: 8px 14px; }
    .key.window { height: 80px; min-height: 0; }

    #tabs { top: 0; bottom: 0; right: auto; width: calc(var(--railw) + env(safe-area-inset-left)); flex-direction: column; overflow-x: hidden; overflow-y: auto;
            padding: calc(env(safe-area-inset-top) + 6px) 6px 6px calc(env(safe-area-inset-left) + 6px); gap: 4px;
            border-top: 0; border-right: 1px solid rgba(255,255,255,.07); }
    .tab { flex: 0 0 auto; min-width: 0; width: 100%; height: 54px; }
    .tab .ic { font-size: 20px; }
    .tab span.t { max-width: 62px; font-size: 10px; }
    #toast { bottom: calc(env(safe-area-inset-bottom) + 12px); left: calc(50% + var(--railw) / 2); }
    #sheetBg { align-items: center; padding-left: calc(var(--railw) / 2); }
    #sheet { max-height: 96dvh; border-radius: 20px; border-bottom: 1px solid var(--line); padding-bottom: 14px; }
    .types { grid-template-columns: repeat(3, 1fr); }
    .type { padding: 10px; } .type small { display: none; }
    .logos { max-height: 120px; }
    .list { max-height: 160px; }
    #login { padding: 10px; }
  }

  /* ---------- chat da live ---------- */
  :root { --chatw: 360px; --chath: 260px; --tabh: 0px; }
  #chat { position: fixed; z-index: 11; display: none; flex-direction: column; background: #0d1016; border: 0 solid rgba(255,255,255,.09); min-width: 0; min-height: 0; }
  body.chat-on #chat { display: flex; }
  #chat .ch { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,.07); flex: none; }
  #chat .ch b { font-size: 13px; margin-right: auto; padding-left: 4px; }
  #chat .cb { height: 32px; min-width: 32px; padding: 0 8px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  #chat .cb.on { border-color: var(--accent); color: var(--accent); }
  #chat .cb svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #chatList { flex: 1; overflow-y: auto; padding: 6px 10px 10px; font-size: var(--chatfs, 14px); line-height: 1.35; -webkit-user-select: text; user-select: text; overscroll-behavior: contain; }
  .cm { padding: 3px 0; word-break: break-word; }
  .cm .pf { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .cm.yt .pf { background: #ff3b3b; } .cm.tw .pf { background: #9146ff; }
  .cm .u { font-weight: 700; margin-right: 5px; }
  .cm .tg { font-size: .72em; font-weight: 800; padding: 1px 5px; border-radius: 5px; margin-right: 5px; background: #2a3142; color: #cfd6e6; vertical-align: 1px; }
  .cm .tg.owner { background: #ffb347; color: #1a1200; } .cm .tg.mod { background: #35d6a0; color: #002116; }
  .cm img.em { height: 1.5em; vertical-align: middle; margin: -2px 1px; }
  .cm.super { background: rgba(255,179,71,.14); border-left: 3px solid #ffb347; padding: 5px 8px; border-radius: 6px; margin: 3px 0; }
  .cm.sys { color: var(--muted); font-style: italic; }
  body.cf-yt .cm.tw, body.cf-tw .cm.yt { display: none; }
  #chatNote { flex: none; padding: 5px 12px; font-size: 12px; color: #ffcf8a; background: rgba(255,179,71,.08); border-top: 1px solid rgba(255,179,71,.2); }
  #chatNote:empty { display: none; }
  #chatNew { position: absolute; right: 14px; bottom: 44px; padding: 6px 12px; border-radius: 999px; border: 0; background: var(--accent); color: #0a0c10; font-weight: 800; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.5); }
  #chatNew[hidden] { display: none; }
  #chatGrip { position: absolute; background: transparent; touch-action: none; z-index: 2; }
  #chatGrip::after { content: ""; position: absolute; background: rgba(255,255,255,.28); border-radius: 3px; }
  #chatSet { position: absolute; inset: 0; z-index: 3; background: #0d1016; padding: 14px; overflow-y: auto; display: none; }
  #chatSet.open { display: block; }
  #chatSet h3 { margin: 0 0 4px; font-size: 16px; } #chatSet p { margin: 0 0 6px; font-size: 12.5px; color: var(--muted); }
  #chatSet .row { display: flex; gap: 8px; margin-top: 14px; } #chatSet .row .btn { padding: 11px; font-size: 14px; }

  body.chat-side #chat { top: 0; right: 0; bottom: var(--tabh); width: var(--chatw); border-left-width: 1px; }
  body.chat-side #chatGrip { left: -9px; top: 0; bottom: 0; width: 20px; cursor: ew-resize; }
  body.chat-side #chatGrip::after { left: 8px; top: 50%; width: 4px; height: 44px; margin-top: -22px; }
  body.chat-side #top { padding-right: calc(var(--chatw) + 10px); }
  body.chat-side main { padding-right: calc(var(--chatw) + 12px); }
  body.chat-side .banner, body.chat-side #editbar { margin-right: calc(var(--chatw) + 12px); }
  body.chat-side .grid, body.chat-side .grid.games { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
  body.chat-side #toast { left: calc(50% + var(--railw, 0px) / 2 - var(--chatw) / 2); }
  body.chat-stack #chat { left: 0; right: 0; bottom: var(--tabh); height: var(--chath); border-top-width: 1px; }
  body.chat-stack #chatGrip { top: -9px; left: 0; right: 0; height: 20px; cursor: ns-resize; }
  body.chat-stack #chatGrip::after { top: 8px; left: 50%; height: 4px; width: 44px; margin-left: -22px; }
  body.chat-stack main { padding-bottom: calc(var(--chath) + var(--tabh) + 30px); }
</style>
</head>
<body data-accent="">
  <header id="top">
    <div class="bar">
      <button id="back" type="button" hidden aria-label="Voltar">‹</button>
      <div id="title">Stream Deck</div>
      <button id="edit" class="hbtn" type="button" aria-label="Editar botoes" hidden></button>
      <button id="add" class="hbtn" type="button" aria-label="Adicionar botao" hidden></button>
      <button id="fs" type="button" aria-label="Tela cheia" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
    <div id="chips"></div>
    <div id="searchWrap" hidden>
      <input id="search" type="search" placeholder="Buscar jogo…" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <div id="editbar" hidden>Modo editar: toque em QUALQUER botão para mudar nome, logo ou ocultar. Nos seus (e nos Modos) dá também para mudar o que ele faz, mover ou apagar.</div>
  <main id="view"></main>
  <nav id="tabs" hidden></nav>
  <aside id="chat" aria-label="Chat da live">
    <div id="chatGrip" aria-hidden="true"></div>
    <div class="ch"><b>Chat</b><span id="chatFilters"></span>
      <button class="cb" id="chatMinus" type="button" aria-label="Letra menor">A−</button>
      <button class="cb" id="chatPlus" type="button" aria-label="Letra maior">A+</button>
      <button class="cb" id="chatCfg" type="button" aria-label="Configurar chat"></button>
      <button class="cb" id="chatX" type="button" aria-label="Fechar chat"></button>
    </div>
    <div id="chatList"></div>
    <button id="chatNew" type="button" hidden>↓ novas mensagens</button>
    <div id="chatNote"></div>
    <div id="chatSet"></div>
  </aside>
  <div id="toast" role="status"></div>
  <div id="sheetBg" hidden><div id="sheet" role="dialog" aria-modal="true"></div></div>

  <div id="login" hidden>
    <form class="card" id="loginForm">
      <h1>Stream Deck</h1>
      <p>Digite o PIN que aparece na janela do PC</p>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="32" placeholder="••••••">
      <button id="loginBtn" type="submit">Entrar</button>
      <div id="loginErr"></div>
    </form>
  </div>

<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const view = $('#view'), banner = $('#banner'), toastEl = $('#toast');
  const UI = window.SD_UI || {}, BR = window.SD_BRANDS || {};
  let TOKEN = '';
  try { TOKEN = localStorage.getItem('sd_token') || ''; } catch (e) {}
  let current = null, lastJSON = '', offline = false, loginOpen = false, toastTimer = 0;
  let editing = false, navDepth = 0, tabsCache = [], optsCache = null;

  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  };
  const norm = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const buzz = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
  const curPath = () => decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  const go = (p) => { navDepth++; location.hash = p ? '#' + p : ''; };
  const goTab = (p) => { navDepth = 0; history.replaceState(null, '', p ? '#' + p : location.pathname + location.search); onHash(); };

  function toast(msg, isErr) {
    toastEl.textContent = msg;
    toastEl.className = 'show' + (isErr ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.className = ''; }, isErr ? 3600 : 1900);
  }

  function setOffline(v) {
    if (v === offline) return;
    offline = v;
    if (v) {
      banner.className = 'banner off'; banner.hidden = false;
      banner.textContent = 'Sem conexão com o PC. Tentando reconectar…';
    } else {
      showNotice(current && current.notice);
      load(true); pollStatus();
    }
  }
  function showNotice(text) {
    banner.className = 'banner';
    banner.hidden = !text;
    banner.textContent = text || '';
  }

  async function api(url, body) {
    const opt = { headers: { 'X-Token': TOKEN } };
    if (body !== undefined) {
      opt.method = 'POST';
      opt.headers['Content-Type'] = 'application/json';
      opt.body = JSON.stringify(body);
    }
    let r;
    try { r = await fetch(url, opt); }
    catch (e) { setOffline(true); throw new Error('Sem conexão com o PC'); }
    setOffline(false);
    if (r.status === 401) { showLogin(); throw new Error('Faça login'); }
    let data = {};
    try { data = await r.json(); } catch (e) {}
    if (!r.ok || data.ok === false) throw new Error(data.error || ('Erro ' + r.status));
    return data;
  }

  /* ---------- icones reais ---------- */
  const SVGNS = 'http://www.w3.org/2000/svg';
  function lum(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return 1;
    const n = parseInt(m[1], 16);
    return (0.2126 * (n >> 16) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255)) / 255;
  }
  function uiIcon(name) {
    const span = el('span', 'ic ui');
    span.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + (UI[name] || UI['app-window'] || '') + '</svg>';
    return span;
  }
  function brandIcon(slug) {
    const b = BR[slug];
    if (!b) return uiIcon('app-window');
    const span = el('span', 'ic brand');
    const color = lum(b.c) < 0.22 ? '#e6e9ef' : b.c;
    span.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="' + color + '" d="' + b.p + '"></path></svg>';
    span.title = b.n;
    return span;
  }
  function imgIcon(src, fallback) {
    const span = el('span', 'ic');
    const im = new Image();
    im.alt = ''; im.decoding = 'async'; im.loading = 'lazy';
    im.onerror = () => { span.replaceChildren(uiIcon(fallback || 'app-window')); };
    im.src = src;
    span.append(im);
    return span;
  }
  const withTok = (u) => u + (u.includes('?') ? '&' : '?') + 't=' + encodeURIComponent(TOKEN);
  function icon(ref) {
    ref = String(ref || '');
    const i = ref.indexOf(':');
    const kind = i > 0 ? ref.slice(0, i) : '', val = i > 0 ? ref.slice(i + 1) : '';
    if (kind === 'ui') return uiIcon(val);
    if (kind === 'brand') return brandIcon(val);
    if (kind === 'fav') return imgIcon('https://www.google.com/s2/favicons?domain=' + encodeURIComponent(val) + '&sz=64', 'globe');
    if (kind === 'img') return imgIcon(withTok(val), 'app-window');
    return uiIcon('zap');
  }

  /* ---------- renderizacao ---------- */
  function hue(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }

  function cover(imgs, name, iconSrc) {
    const box = el('div', 'cover');
    const init = el('div', 'initial', ((name || '?').trim()[0] || '?').toUpperCase());
    init.style.setProperty('--h', hue(name || ''));
    box.append(init);
    if (imgs && imgs.length) {
      let i = 0;
      const im = new Image();
      im.alt = ''; im.loading = 'lazy'; im.decoding = 'async';
      im.onerror = () => { i++; if (i < imgs.length) im.src = imgs[i]; else { im.remove(); addIco(); } };
      im.src = imgs[0];
      box.append(im);
    } else addIco();
    function addIco() {
      if (!iconSrc) return;
      const g = el('span', 'gico');
      const im = new Image(); im.alt = ''; im.onerror = () => g.remove();
      im.src = withTok(iconSrc);
      g.append(im); box.append(g); init.style.opacity = '.35';
    }
    return box;
  }

  function tile(it) {
    const b = el('button', 'key');
    b.type = 'button';
    b.dataset.kind = it.kind || '';
    b.dataset.label = it.label || '';
    if (it.cid) b.dataset.cid = it.cid;
    if (it.mid) b.dataset.mid = it.mid;
    if (it.okey) b.dataset.okey = it.okey;
    if (it.hidden) b.classList.add('off');
    if (it.accent) b.dataset.accent = it.accent;
    if (it.type === 'folder') b.classList.add('folder');
    if (it.kind === 'window') b.classList.add('window');
    if (it.tone) b.classList.add('t-' + it.tone);
    if (it.on) b.classList.add('on');
    if (it.wide) b.classList.add('wide');
    if (it.kind === 'game') {
      b.classList.add('game');
      b.append(cover(it.imgs, it.label, it.img), el('span', 'lbl', it.label));
    } else {
      const ico = el('span', 'ico');
      ico.append(icon(it.icon));
      b.append(ico, el('span', 'lbl', it.label));
      if (it.sub) b.append(el('span', 'sub', it.sub));
    }
    if (it.pin) b.dataset.pin = '1';
    if (it.menu && it.menu.length) {
      let timer = 0, sx = 0, sy = 0;
      const clear = () => { clearTimeout(timer); timer = 0; };
      b.addEventListener('pointerdown', (e) => {
        if (editing) return;
        sx = e.clientX; sy = e.clientY; clear();
        timer = setTimeout(() => { timer = 0; b._lp = true; buzz(25); openMenu(it); }, 480);
      });
      b.addEventListener('pointermove', (e) => { if (timer && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) clear(); });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => b.addEventListener(ev, clear));
      b.addEventListener('contextmenu', (e) => e.preventDefault());
    }
    b.addEventListener('click', (ev) => {
      if (b._lp) { b._lp = false; ev.preventDefault(); return; }
      if (editing) {
        if (it.cid) openEdit(it);
        else if (it.mid) openModeEdit(it.mid);
        else if (it.okey) openBuiltinEdit(it);
        else toast('Esse botão é automático (muda sozinho) e não dá para editar.');
        return;
      }
      if (it.type === 'folder') go(it.path);
      else if (it.action === 'chat.open') { buzz(10); toggleChat(); }
      else press(it, b);
    });
    return b;
  }

  function renderTabs(d) {
    const tabs = (d.tabs && d.tabs.length) ? d.tabs : tabsCache;
    tabsCache = tabs;
    const nav = $('#tabs');
    nav.hidden = !tabs.length || loginOpen;
    nav.replaceChildren();
    tabs.forEach((t) => {
      const b = el('button', 'tab' + (t.path === d.tab ? ' on' : ''));
      b.type = 'button';
      b.dataset.accent = '';
      b.append(icon(t.icon), el('span', 't', t.label));
      b.addEventListener('click', () => { buzz(8); if (editing && false) return; goTab(t.path); });
      nav.append(b);
    });
    const on = nav.querySelector('.tab.on');
    if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
  }

  function render(d) {
    document.body.dataset.accent = d.accent || '';
    $('#title').textContent = d.title || 'Stream Deck';
    $('#back').hidden = !d.path || !!d.tab && d.path === (tabPath(d.tab));
    $('#searchWrap').hidden = !d.search;
    showNotice(offline ? null : d.notice);
    if (offline) { banner.className = 'banner off'; banner.hidden = false; }
    renderTabs(d);

    const sections = [];
    let cur = { title: null, items: [] };
    for (const it of d.items || []) {
      if (it.type === 'header') { if (cur.title || cur.items.length) sections.push(cur); cur = { title: it.label, items: [] }; }
      else cur.items.push(it);
    }
    if (cur.title || cur.items.length) sections.push(cur);

    const frag = document.createDocumentFragment();
    for (const s of sections) {
      if (s.title) frag.append(el('div', 'sec', s.title));
      const g = el('div', 'grid' + (s.items.some((i) => i.kind === 'game') ? ' games' : ''));
      s.items.forEach((i) => g.append(tile(i)));
      frag.append(g);
    }
    if (!sections.length) {
      const box = el('div', 'emptybox');
      if ((d.path || '').startsWith('custom/')) {
        box.append(el('div', '', 'Ainda não tem nada aqui.'));
        const ab = el('button', 'btn pri', '+ Adicionar botão aqui'); ab.type = 'button';
        ab.onclick = () => openAdd();
        box.append(ab);
      } else box.append(el('div', '', 'Nada por aqui.'));
      frag.append(box);
    }
    view.replaceChildren(frag);
    if (typeof chatLayout === 'function' && document.body.classList.contains('chat-on')) chatLayout();
    balance();
    applySearch();
  }
  const tabPath = (id) => id;

  /* distribui os botoes em linhas parelhas (ex.: 9 botoes = 3x3, nao 6 + 3) */
  function balance() {
    view.querySelectorAll('.grid').forEach((g) => {
      g.style.gridTemplateColumns = '';
      const n = g.children.length;
      const c = getComputedStyle(g).gridTemplateColumns.split(' ').filter(Boolean).length;
      if (n <= c || c < 2) return;
      const r0 = Math.ceil(n / c);
      let best = null;
      for (let r = r0; r <= r0 + 1; r++) {
        const cols = Math.ceil(n / r), empty = r * cols - n;
        if (cols > c) continue;
        if (!best || empty < best.empty) best = { cols, empty };
      }
      if (best && best.cols < c) g.style.gridTemplateColumns = 'repeat(' + best.cols + ', 1fr)';
    });
  }
  let balT = 0;
  window.addEventListener('resize', () => { clearTimeout(balT); balT = setTimeout(balance, 120); });

  function applySearch() {
    const q = norm($('#search').value.trim());
    view.querySelectorAll('.key.game').forEach((k) => {
      k.classList.toggle('hide', !!q && !norm(k.dataset.label).includes(q));
    });
  }
  $('#search').addEventListener('input', applySearch);

  /* ---------- acoes ---------- */
  async function press(it, b) {
    if (it.confirm && !window.confirm(it.confirm)) return;
    let arg = it.arg;
    if (it.asks && it.asks.length) {
      const yes = [];
      for (const a of it.asks) {
        const v = await askYesNo(a.text, it.label);
        if (v === null) return;
        if (v) yes.push(a.i);
      }
      arg = { id: it.arg, yes };
    }
    buzz(14);
    b.classList.add('busy');
    try {
      const r = await api('/api/run', { action: it.action, arg });
      toast(r.msg || 'OK');
      if (it.go) go(it.go);
    } catch (e) {
      buzz([40, 40, 40]);
      toast(e.message, true);
    } finally {
      b.classList.remove('busy');
      setTimeout(() => { load(true); pollStatus(); }, 450);
    }
  }

  /* menu de opcoes (segurar numa janela) */
  function openMenu(it) {
    sheetBg.hidden = false;
    sheet.replaceChildren(el('div', 'grab'), el('h2', '', it.label));
    if (it.sub) sheet.append(el('p', 'hint', it.sub));
    const list = el('div', 'list'); list.style.maxHeight = 'none';
    it.menu.forEach((m) => {
      const o = el('button', 'opt' + (m.tone === 'danger' ? ' danger' : '')); o.type = 'button';
      const meta = el('div', 'meta'); meta.append(el('b', '', m.label));
      o.append(icon(m.icon), meta);
      o.onclick = async () => {
        if (m.confirm && !window.confirm(m.confirm)) return;
        closeSheet(); buzz(14);
        try { const r = await api('/api/run', { action: m.action, arg: m.arg }); toast(r.msg || 'OK'); }
        catch (e) { buzz([40, 40, 40]); toast(e.message, true); }
        setTimeout(() => load(true), 500);
      };
      list.append(o);
    });
    const c = el('div', 'acts'); const x = el('button', 'btn', 'Cancelar'); x.type = 'button'; x.onclick = closeSheet; c.append(x);
    sheet.append(list, c);
  }

  async function load(quiet) {
    const p = curPath();
    try {
      const d = await api('/api/folder?path=' + encodeURIComponent(p) + (editing ? '&edit=1' : ''));
      if (p !== curPath()) return;

  })();
  const fsBtn = $('#fs');

  }

  function startForm(init) {

  /* logos: usado no botao, no painel, na aba e no modo */

  /* ---------- chat da live (YouTube pelo PC, Twitch direto do celular) ---------- */
  const Chat = { on: false, cfg: null, seq: 0, ws: null, wsT: 0, pollT: 0, filter: 'all', status: { yt: '', tw: '' }, stick: true, n: 0 };
  const chatEl = $('#chat'), chatList = $('#chatList'), chatNote = $('#chatNote'), chatSet = $('#chatSet');

  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

  /* ---- Twitch: leitura anonima do chat (IRC por WebSocket) ---- */
  const unesc = (s) => s.replace(/\\(.)/g, (_, c) => ({ s: ' ', n: '\n', r: '\r', ':': ';', '\\': '\\' }[c] || c));
  function parseIRC(line) {
    const tags = {}; let rest = line;
    if (rest[0] === '@') { const i = rest.indexOf(' '); rest.slice(1, i).split(';').forEach((kv) => { const j = kv.indexOf('='); tags[kv.slice(0, j)] = kv.slice(j + 1); }); rest = rest.slice(i + 1); }
    let prefix = '';
    if (rest[0] === ':') { const i = rest.indexOf(' '); prefix = rest.slice(1, i); rest = rest.slice(i + 1); }
    let trailing = ''; const si = rest.indexOf(' :');
    if (si >= 0) { trailing = rest.slice(si + 2); rest = rest.slice(0, si); }
    const p = rest.split(' ');
    return { tags, prefix, cmd: p[0], params: p.slice(1), trailing };
  }
  function twParts(text, emotes) {
    const chars = Array.from(text), spans = [];
    (emotes || '').split('/').forEach((e) => {
      if (!e) return; const [id, pos] = e.split(':');
      (pos || '').split(',').forEach((r) => { const [a, b] = r.split('-').map(Number); if (!isNaN(a) && !isNaN(b)) spans.push({ a, b, id }); });
    });
    spans.sort((x, y) => x.a - y.a);
    const out = []; let i = 0;
    spans.forEach((s) => {
      if (s.a < i) return;
      if (s.a > i) out.push({ t: chars.slice(i, s.a).join('') });
      out.push({ img: 'https://static-cdn.jtvnw.net/emoticons/v2/' + s.id + '/default/dark/1.0', t: chars.slice(s.a, s.b + 1).join('') });
      i = s.b + 1;
    });
    if (i < chars.length) out.push({ t: chars.slice(i).join('') });
    return out;
  }
  function twHandle(line) {
    const m = parseIRC(line);
    if (m.cmd === 'PING') { if (Chat.ws && Chat.ws.readyState === 1) Chat.ws.send('PONG :' + (m.trailing || 'tmi.twitch.tv')); return; }
    if (m.cmd === '001') { Chat.status.tw = ''; chatNoteUpdate(); return; }
    if (m.cmd !== 'PRIVMSG') return;
    let text = m.trailing, act = false;
    const ma = /^\u0001ACTION (.*)\u0001$/.exec(text); if (ma) { text = ma[1]; act = true; }
    const name = unesc(m.tags['display-name'] || m.prefix.split('!')[0]);
    const b = []; const bd = m.tags.badges || '';
    if (/broadcaster\//.test(bd)) b.push('owner'); else if (/moderator\//.test(bd) || m.tags.mod === '1') b.push('mod');
    const row = { p: 'tw', u: name, x: text, c: m.tags.color || '', b, parts: twParts(text, m.tags.emotes) };
    if (m.tags.bits) row.super = m.tags.bits + ' bits';
    chatAdd(row);
  }
  function twStop() { clearTimeout(Chat.wsT); if (Chat.ws) { try { Chat.ws.onclose = null; Chat.ws.close(); } catch (e) {} Chat.ws = null; } }
  function twStart() {
    twStop();
    const ch = Chat.cfg && Chat.cfg.twitch;
    if (!ch || !Chat.on) return;
    Chat.status.tw = 'conectando…'; chatNoteUpdate();
    let ws;
    try { ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443'); } catch (e) { Chat.status.tw = 'sem acesso à Twitch'; chatNoteUpdate(); return; }
    Chat.ws = ws; let buf = '';
    ws.onopen = () => {
      ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
      ws.send('PASS SCHMOOPIIE');
      ws.send('NICK justinfan' + (10000 + Math.floor(Math.random() * 89999)));
      ws.send('JOIN #' + ch);
    };
    ws.onmessage = (ev) => { buf += ev.data; const lines = buf.split('\r\n'); buf = lines.pop(); lines.forEach((l) => { if (l) try { twHandle(l); } catch (e) {} }); };
    ws.onclose = () => { if (!Chat.on || Chat.ws !== ws) return; Chat.status.tw = 'reconectando…'; chatNoteUpdate(); Chat.wsT = setTimeout(twStart, 3000); };
    ws.onerror = () => {};
  }

  /* ---- YouTube: o PC le o chat e o celular busca as mensagens ---- */
  function ytStop() { clearInterval(Chat.pollT); Chat.pollT = 0; }
  async function ytPoll() {
    if (!Chat.on || !Chat.cfg || !Chat.cfg.youtube) return;
    try {
      const r = await api('/api/chat/poll?since=' + Chat.seq);
      if (r.seq < Chat.seq) { Chat.seq = 0; return; }
      Chat.seq = r.seq;
      (r.msgs || []).forEach(chatAdd);
      Chat.status.yt = r.status || '';
    } catch (e) { Chat.status.yt = 'sem conexão com o PC'; }
    chatNoteUpdate();
  }
  function ytStart() {
    ytStop();
    if (!(Chat.cfg && Chat.cfg.youtube) || !Chat.on) return;
    Chat.seq = 0; Chat.status.yt = 'conectando…'; chatNoteUpdate();
    ytPoll(); Chat.pollT = setInterval(ytPoll, 1500);
  }

  function chatRestart() {
    chatList.replaceChildren(); Chat.stick = true;
    chatFilters(); twStop(); ytStop();
    Chat.status = { yt: '', tw: '' }; chatNoteUpdate();
    const c = Chat.cfg || {};
    if (!c.youtube && !c.twitch) { chatAdd({ p: 'yt', sys: true, x: 'Toque na engrenagem e coloque seu canal do YouTube e/ou da Twitch.' }); openChatSet(); return; }
    twStart(); ytStart();
  }

  function openChatSet() {
    const c = Chat.cfg || {};
    chatSet.replaceChildren();
    const yt = el('input', 'inp'); yt.placeholder = 'Link da live, @canal ou ID do vídeo'; yt.value = c.youtube_raw || c.youtube || '';
    yt.autocapitalize = 'off'; yt.autocomplete = 'off'; yt.spellcheck = false;
    const tw = el('input', 'inp'); tw.placeholder = 'Nome do canal (ex.: meucanal)'; tw.value = c.twitch || '';
    tw.autocapitalize = 'off'; tw.autocomplete = 'off'; tw.spellcheck = false;
    const err = el('div', 'err'); err.style.cssText = 'color:#ff9aa4;font-size:13px;margin-top:10px;min-height:18px';
    const ok = el('button', 'btn pri', 'Salvar'); ok.type = 'button';
    const cn = el('button', 'btn', 'Cancelar'); cn.type = 'button';
    cn.onclick = () => chatSet.classList.remove('open');
    ok.onclick = async () => {
      err.textContent = '';
      try {
        await api('/api/custom/chat_save', { youtube: yt.value, twitch: tw.value });
        Chat.cfg = await api('/api/custom/chat_get', {});
        chatSet.classList.remove('open'); chatRestart();
      } catch (e) { err.textContent = e.message; }
    };
    const row = el('div', 'row'); row.append(cn, ok);
    chatSet.append(el('h3', '', 'Chat da live'),
      el('p', '', 'Preencha um ou os dois. Com os dois, as mensagens aparecem juntas (dá para filtrar).'),
      el('label', 'fld', 'YouTube'), yt,
      el('p', '', 'Com @canal ele acha a live que estiver no ar sozinho. Com o link/ID, fica fixo naquela live.'),
      el('label', 'fld', 'Twitch'), tw, err, row);
    chatSet.classList.add('open');
  }
  $('#chatCfg').onclick = openChatSet;
  $('#chatX').onclick = () => closeChat();
  $('#chatMinus').onclick = () => { chatFs = clamp(chatFs - 1, 10, 26); lsSet('sd_chatfs', String(chatFs)); chatLayout(); };
  $('#chatPlus').onclick = () => { chatFs = clamp(chatFs + 1, 10, 26); lsSet('sd_chatfs', String(chatFs)); chatLayout(); };

  async function openChat() {
    if (Chat.on) return;
    Chat.on = true; document.body.classList.add('chat-on'); chatLayout();
    try { Chat.cfg = await api('/api/custom/chat_get', {}); } catch (e) { Chat.cfg = {}; }
    if (!Chat.on) return;
    chatRestart();
  }
  function closeChat() {
    Chat.on = false; twStop(); ytStop(); chatSet.classList.remove('open');
    document.body.classList.remove('chat-on', 'chat-side', 'chat-stack', 'cf-yt', 'cf-tw');
    document.documentElement.style.setProperty('--tabh', '0px');
    balance();
  }
  function toggleChat() { if (Chat.on) closeChat(); else openChat(); }

  if (!TOKEN) showLogin(); else { setHeaderBtns(true); load(); pollStatus(); }
})();
</script>
</body>
